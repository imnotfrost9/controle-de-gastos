<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Controle Financeiro</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box-login { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>
    <div class="box-login">
        <h2>Entrar</h2>
        {% if erro %}<p style="color: red;">{{ erro }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuário" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit" class="btn-salvar">Entrar</button>
        </form>
        <p style="margin-top: 15px;">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>
</body>
</html>
